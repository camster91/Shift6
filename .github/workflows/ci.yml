name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npm run doctor

      - name: Validate asset manifest
        run: npm run validate:assets

      - name: Check tracked secrets
        run: npm run check:secrets

      - name: Validate release config
        run: npm run validate:release-config

      - name: Validate native artwork assets
        run: npm run validate:release-assets

      - name: Audit production dependencies
        # Allow-list (2026-10-11): braces GHSA-vfj7-8cjw-p6xm and
        # node-forge GHSA-86w9-cpqp-85rv — no upstream fix. Audit still
        # runs and fails on any other high/critical leaf advisory.
        env:
          ALLOWED: GHSA-vfj7-8cjw-p6xm GHSA-86w9-cpqp-85rv
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high --json > /tmp/npm-audit.json || true
          python3 - <<'AUDITPY'
          import json, os, sys
          allowed = set(os.environ["ALLOWED"].split())
          data = json.load(open("/tmp/npm-audit.json"))
          bad = []
          for vuln in data.get("vulnerabilities", {}).values():
              for item in vuln.get("via", []):
                  if not isinstance(item, dict):
                      continue
                  if item.get("severity") not in ("high", "critical"):
                      continue
                  url = item.get("url") or ""
                  ghsa = url.rsplit("/", 1)[-1] if "/advisories/" in url else None
                  if ghsa and ghsa not in allowed:
                      bad.append(f"{ghsa} ({item.get('name')}: {item.get('title')})")
          if bad:
              print("Unexpected high/critical advisories (not allow-listed):")
              for line in sorted(set(bad)):
                  print(f"  - {line}")
              sys.exit(1)
          print(
              "Audit OK: only allow-listed high advisories present "
              f"({', '.join(sorted(allowed))})."
          )
          AUDITPY

      - name: Unit and component tests
        run: npm test -- --ci

      - name: iOS, Android and web export smoke
        run: npm run export:all
