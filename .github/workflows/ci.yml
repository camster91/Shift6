name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npm run doctor

      - name: Validate asset manifest
        run: npm run validate:assets

      - name: Check tracked secrets
        run: npm run check:secrets

      - name: Validate release config
        run: npm run validate:release-config

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit and component tests
        run: npm test -- --ci

      - name: iOS, Android and web export smoke
        run: npm run export:all
