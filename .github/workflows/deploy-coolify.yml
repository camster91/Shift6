name: Build, Test & Deploy to Coolify

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production

      # Capacitor sync so any native-side changes are committed; cheap and idempotent.
      - name: Capacitor sync (no-op if web-only changes)
        run: npx cap sync android
        continue-on-error: true

      # Trigger Coolify deploy via REST API. Async, returns ~200ms.
      # Uses set -e and explicit exit codes so failures actually fail the workflow.
      - name: Trigger Coolify Deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -e  # Fail on any error
          HTTP_CODE=$(curl -s -o /tmp/deploy-resp.txt -w '%{http_code}' \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/start")
          CURL_EXIT=$?
          echo "Response: HTTP ${HTTP_CODE}"
          cat /tmp/deploy-resp.txt | head -c 500
          echo ""
          if [ $CURL_EXIT -ne 0 ]; then
            echo "ERROR: curl failed with exit code $CURL_EXIT (likely timeout)"
            exit 1
          fi
          if [ -z "${HTTP_CODE}" ] || [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 400 ]; then
            echo "ERROR: deploy endpoint returned HTTP ${HTTP_CODE}"
            exit 1
          fi
          echo "Deployment queued!"

      # Verify the live site is serving the bundle we just built.
      # Compares the bundle hash from dist/ to what the live site serves.
      - name: Verify live site bundle matches build
        env:
          SITE: https://getshift6.com
        run: |
          # Wait for Coolify to actually deploy
          sleep 60

          # Get the bundle hash from the dist directory (just built)
          EXPECTED_JS=$(ls -1 dist/assets/index-*.js 2>/dev/null | head -1 | xargs basename)
          if [ -z "${EXPECTED_JS}" ]; then
            echo "ERROR: no bundle in dist/assets/"
            exit 1
          fi
          echo "Expected bundle: ${EXPECTED_JS}"

          # Curl the live site (cache-busted)
          HTML=$(curl -s --max-time 15 "${SITE}/?cb=$(date +%s)")
          DEPLOYED_JS=$(echo "${HTML}" | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "Live bundle: ${DEPLOYED_JS}"

          if [ "${EXPECTED_JS}" != "${DEPLOYED_JS}" ]; then
            echo "ERROR: bundle mismatch — live site is serving an old bundle"
            echo "Expected: ${EXPECTED_JS}"
            echo "Live: ${DEPLOYED_JS}"
            exit 1
          fi
          echo "Live site serving the expected bundle"