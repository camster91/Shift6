name: Expo patch alignment

on:
  push:
    branches:
      - feat/306-shift-repository-sync

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/306-shift-repository-sync
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align Expo SDK 57 patch versions
        run: |
          npm install --save-exact=false expo@~57.0.25 expo-build-properties@~57.0.22 expo-linking@~57.0.11 expo-notifications@~57.0.21 expo-router@~57.0.23
          npm run doctor
      - name: Commit lockfile alignment when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align Expo SDK 57 patch versions"
          git push origin HEAD:feat/306-shift-repository-sync
