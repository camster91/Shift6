name: Format diagnostic

on:
  push:
    branches:
      - feat/306-shift-repository-sync

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print formatted files
        run: |
          npm run format
          echo "===PRIVACY==="
          cat src/db/privacyRepository.ts
          echo "===SHIFT_TEST==="
          cat src/db/shiftRepository.test.ts
          echo "===SYNC_TEST==="
          cat src/db/syncRepository.test.ts
          echo "===END==="
