name: Native runtime QA

on:
  # Completion coordination activates once this workflow reaches the default branch.
  workflow_run:
    workflows: ['Native validation']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-runtime-qa-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  ios-guest-journey:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Find a successful native build with identical app source
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          QA_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          QA_NATIVE_BUILD_RUN: ${{ github.event.workflow_run.id || '' }}
        run: python3 scripts/select-native-qa-artifact.py
      - uses: actions/download-artifact@v8
        with:
          name: ios-unsigned-simulator-release
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: native-qa
      - name: Verify actual application source and native payload before installation
        env:
          QA_NATIVE_SOURCE: ${{ steps.candidate.outputs.source_sha }}
        run: |
          python3 scripts/native_artifact_source_test.py
          python3 scripts/native_artifact_source.py verify --platform ios --manifest native-qa/native-source.json --expected-source-sha "$QA_NATIVE_SOURCE"
          mkdir -p native-qa/evidence
          cp native-qa/native-source.json native-qa/evidence/native-source.json
      - name: Install pinned UI automation tooling
        run: |
          npm install --global appium@3.8.0
          appium driver install --source=npm appium-xcuitest-driver@12.17.3
      - name: Run the guest journey on iPhone simulator
        env:
          QA_NATIVE_SOURCE: ${{ steps.candidate.outputs.source_sha }}
          QA_NATIVE_RUN: ${{ steps.candidate.outputs.run_id }}
        run: |
          mkdir -p native-qa/evidence
          appium --address 127.0.0.1 --log native-qa/evidence/appium.log --log-timestamp > native-qa/evidence/appium-console.log 2>&1 &
          python3 scripts/mobile-runtime-qa.py
      - name: Preserve screenshots, UI trees and actual results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-guest-runtime-qa
          path: native-qa/evidence
          if-no-files-found: warn
