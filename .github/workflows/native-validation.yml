name: Native validation

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.env.release.example'

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_PUBLIC_ENVIRONMENT: staging
  EXPO_PUBLIC_RELEASE_MODE: guest-only
  EXPO_PUBLIC_API_BASE_URL: ''
  EXPO_NO_DOTENV: '1'
  NODE_ENV: production

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QA_NATIVE_ARCHITECTURES: arm64-v8a,x86_64
      QA_NATIVE_CONFIGURATION: Release
      QA_NATIVE_GRADLE_TASK: assembleRelease
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --include=dev
      - run: npm run validate:release-config
      - run: npm run validate:release-assets
      - name: Check native artifact proof rejection cases
        run: python3 scripts/native_artifact_source_test.py
      - name: Reject unexpected build inputs or guest release context
        run: python3 scripts/native_artifact_source.py check --platform android
      - run: npx expo prebuild --no-install --platform android
      - name: Compile release-mode APK for testing
        working-directory: android
        run: ./gradlew "$QA_NATIVE_GRADLE_TASK" "-PreactNativeArchitectures=$QA_NATIVE_ARCHITECTURES" --no-daemon --max-workers=2
      - name: Save test-signed APK (not a store submission)
        run: |
          mkdir -p native-qa-artifact
          cp android/app/build/outputs/apk/release/app-release.apk native-qa-artifact/app-release.apk
          python3 scripts/native_artifact_source.py create --platform android --payload native-qa-artifact/app-release.apk --manifest native-qa-artifact/native-source.json
      - name: Preserve test-signed APK and checkout proof
        uses: actions/upload-artifact@v7
        with:
          name: android-test-release
          path: native-qa-artifact
          include-hidden-files: true
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      QA_NATIVE_ARCHITECTURES: arm64
      QA_NATIVE_CONFIGURATION: Release
      QA_NATIVE_SDK: iphonesimulator
      QA_NATIVE_ONLY_ACTIVE_ARCH: 'YES'
      QA_NATIVE_CODE_SIGNING_ALLOWED: 'NO'
      # Canonical Maven Central endpoint; RN retains its normal SHA verification.
      ENTERPRISE_REPOSITORY: https://repo.maven.apache.org/maven2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run validate:release-config
      - run: npm run validate:release-assets
      - name: Check native artifact proof rejection cases
        run: python3 scripts/native_artifact_source_test.py
      - name: Reject unexpected build inputs or guest release context
        run: python3 scripts/native_artifact_source.py check --platform ios
      - run: npx expo prebuild --no-install --platform ios
      - name: Prefetch checksum-verified React Native archives
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          rn_version=$(node -p "require('react-native/package.json').version")
          if [[ ! "$rn_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Prebuilt archive preparation requires a pinned stable React Native version."
            exit 1
          fi
          cache_dir="$HOME/Library/Caches/ReactNative"
          mkdir -p "$cache_dir"
          verify_archive() {
            [[ -f "$1" ]] && [[ "$(shasum -a 256 "$1" | awk '{print $1}')" == "$expected_sha256" ]]
          }
          for artifact in reactnative-dependencies reactnative-core; do
            for configuration in debug release; do
              filename="${artifact}-${rn_version}-${configuration}.tar.gz"
              archive_url="${ENTERPRISE_REPOSITORY}/com/facebook/react/react-native-artifacts/${rn_version}/react-native-artifacts-${rn_version}-${artifact}-${configuration}.tar.gz"
              expected_sha256=$(curl --fail --silent --show-error --location --connect-timeout 20 --max-time 30 --retry 2 --retry-max-time 90 "${archive_url}.sha256")
              if [[ ! "$expected_sha256" =~ ^[a-f0-9]{64}$ ]]; then
                echo "::error::Missing or invalid Maven SHA-256 for ${filename}; refusing to populate the cache."
                exit 1
              fi
              destination="$cache_dir/$filename"
              partial="$cache_dir/${filename}.shift6-partial"
              if verify_archive "$destination"; then
                echo "Verified existing ${filename}"
                continue
              fi
              verified=false
              for attempt in 1 2 3 4; do
                echo "Preparing ${filename}, bounded attempt ${attempt}/4"
                if verify_archive "$partial"; then
                  mv "$partial" "$destination"
                  verified=true
                  break
                fi
                if curl --fail --silent --show-error --location --connect-timeout 20 --max-time 180 --speed-limit 1024 --speed-time 30 --continue-at - --output "$partial" "$archive_url"; then
                  if verify_archive "$partial"; then
                    mv "$partial" "$destination"
                    verified=true
                    break
                  fi
                  echo "::warning::Checksum mismatch for ${filename}; discarding only this untrusted partial file."
                  rm -f "$partial"
                else
                  curl_status=$?
                  echo "::warning::Transfer ${filename} failed with curl ${curl_status}; cache remains unmodified."
                  if [[ "$curl_status" == 33 ]]; then
                    rm -f "$partial"
                  fi
                fi
                sleep 5
              done
              if [[ "$verified" != true ]]; then
                echo "::error::Could not obtain a verified ${filename} within bounded retries. Native compilation remains unverified."
                exit 1
              fi
            done
          done
      - name: Install native pods
        working-directory: ios
        run: pod install
      - name: Compile unsigned Release simulator app
        run: >-
          xcodebuild -workspace ios/SHIFT6.xcworkspace -scheme SHIFT6
          -configuration "$QA_NATIVE_CONFIGURATION" -sdk "$QA_NATIVE_SDK"
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath native-build ARCHS="$QA_NATIVE_ARCHITECTURES"
          ONLY_ACTIVE_ARCH="$QA_NATIVE_ONLY_ACTIVE_ARCH" CODE_SIGNING_ALLOWED="$QA_NATIVE_CODE_SIGNING_ALLOWED" build
      - name: Bind simulator payload to its actual checkout
        run: |
          mkdir -p native-qa-artifact
          cp -R native-build/Build/Products/Release-iphonesimulator/SHIFT6.app native-qa-artifact/SHIFT6.app
          python3 scripts/native_artifact_source.py create --platform ios --payload native-qa-artifact/SHIFT6.app --manifest native-qa-artifact/native-source.json
      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-simulator-release
          path: native-qa-artifact
          include-hidden-files: true
          if-no-files-found: error
      - name: Install and cold-launch on iPhone simulator
        run: |
          python3 scripts/native_artifact_source.py verify --platform ios --manifest native-qa-artifact/native-source.json --expected-source-sha "$(git rev-parse HEAD)"
          simulator_id=$(python3 - <<'PYTHON'
          import json, subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          phones=[d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith('iPhone')]
          if not phones: raise SystemExit('No available iPhone simulator')
          print(phones[0]['udid'])
          PYTHON
          )
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" native-qa-artifact/SHIFT6.app
          xcrun simctl launch "$simulator_id" com.shift6.app
          sleep 5
          xcrun simctl io "$simulator_id" screenshot native-build/ios-cold-launch.png
          xcrun simctl spawn "$simulator_id" launchctl list | awk '$1 ~ /^[0-9]+$/ && $1 != 0 && /com[.]shift6[.]app/ {live=1} END {exit !live}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-cold-launch
          path: native-build/ios-cold-launch.png
          if-no-files-found: warn
