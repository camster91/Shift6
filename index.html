  <!-- Apple PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Armor — 2 Pillars, 4 Daily Habits, Train Through Chaos</title>

  <style>
    body {
      background-color: #020617;
    }
    html.light body {
      background-color: #f1f5f9;
    }
  </style>
  <script>
    // Prevent white flash: apply saved theme + sync the browser chrome
    // theme color before paint.
    (function() {
      try {
        var theme = localStorage.getItem('armor_theme') || localStorage.getItem('shift6_theme');
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'light' ? '#f1f5f9' : '#020617');
        }
      } catch(e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>

</body>
