  <script>
    // Prevent white flash: apply saved theme before paint
    (function() {
      try {
        var theme = localStorage.getItem('armor_theme') || localStorage.getItem('shift6_theme');
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch(e) {}
    })();
